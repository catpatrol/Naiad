[pytest]
# `tests` added 2026-08-02. With `testpaths = fixtures` alone, tests/test_analytics.py
# -- the whole F-AN-1..14 regression guard for analytics/ -- was never collected by a
# bare `pytest` run. The guard existed and did not execute unless someone named the
# file. Verified before changing: `pytest --collect-only fixtures tests` adds exactly
# 41 items, all from tests/test_analytics.py, and tests/ contains no other test module
# (the rest of that tree is brief_fixture data).
testpaths = fixtures tests
addopts = -q

markers =
    slow: long-running test; deselect with -m "not slow"
